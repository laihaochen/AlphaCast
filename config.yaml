output_dir: outputs
use_features: True
use_exogenous: True

datasets:
  # =========================================================================
  # EPF — Electricity Price Forecasting (5 European markets, hourly)
  # =========================================================================
  - name: EPF_BE
    aliases: [epf_be, be]
    training_csv: dataset/EPF/BE/EPF_BE_train.csv
    test_csv: dataset/EPF/BE/EPF_BE_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: H
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/EPF_BE.txt

  - name: EPF_DE
    aliases: [epf_de, de]
    training_csv: dataset/EPF/DE/EPF_DE_train.csv
    test_csv: dataset/EPF/DE/EPF_DE_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: H
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/EPF_DE.txt

  - name: EPF_FR
    aliases: [epf_fr, fr]
    training_csv: dataset/EPF/FR/EPF_FR_train.csv
    test_csv: dataset/EPF/FR/EPF_FR_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: H
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/EPF_FR.txt

  - name: EPF_NP
    aliases: [epf_np, np]
    training_csv: dataset/EPF/NP/EPF_NP_train.csv
    test_csv: dataset/EPF/NP/EPF_NP_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: H
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/EPF_NP.txt

  - name: EPF_PJM
    aliases: [epf_pjm, pjm]
    training_csv: dataset/EPF/PJM/EPF_PJM_train.csv
    test_csv: dataset/EPF/PJM/EPF_PJM_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: H
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/EPF_PJM.txt

  # =========================================================================
  # ETT — Electricity Transformer Temperature (4 variants)
  # ETTh1/ETTh2: hourly; ETTm1/ETTm2: 15-minute
  # =========================================================================
  - name: ETTh1
    aliases: [etth1]
    training_csv: dataset/ETT/ETTh1/ETT_ETTh1_train.csv
    test_csv: dataset/ETT/ETTh1/ETT_ETTh1_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: H
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/ETTh1.txt

  - name: ETTm1
    aliases: [ettm1]
    training_csv: dataset/ETT/ETTm1/ETT_ETTm1_train.csv
    test_csv: dataset/ETT/ETTm1/ETT_ETTm1_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: 15min
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/ETTm1.txt

  # =========================================================================
  # MOPEX — daily streamflow discharge (hydrology)
  # =========================================================================
  - name: MOPEX
    aliases: [mopex]
    training_csv: dataset/MOPEX/mopex_train.csv
    test_csv: dataset/MOPEX/mopex_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: D
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/MOPEX.txt

  # =========================================================================
  # POWER — wind & solar power generation (15-minute)
  # =========================================================================
  - name: POWER_Windy
    aliases: [power_windy, windy_power, windy]
    training_csv: dataset/POWER_NEW/windy_power/windy_power_train.csv
    test_csv: dataset/POWER_NEW/windy_power/windy_power_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: 15min
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/windy_power.txt

  - name: POWER_Sunny
    aliases: [power_sunny, sunny_power, sunny]
    training_csv: dataset/POWER_NEW/sunny_power/sunny_power_train.csv
    test_csv: dataset/POWER_NEW/sunny_power/sunny_power_test.csv
    look_back: 96
    predicted_window: 96
    sliding_window: 96
    frequency: 15min
    checkpoints: {}
    context_prompt_file: prompts/contextual_briefings/sunny_power.txt
